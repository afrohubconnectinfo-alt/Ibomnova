<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ibomnova - Control Centre</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:20px}
.card{background:#111;border:1px solid #333;padding:20px;border-radius:15px;margin:15px 0}
button{background:#f5ff00;color:#000;padding:12px 20px;border:none;border-radius:10px;font-weight:bold;width:100%;cursor:pointer}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;margin:10px 0}
.hidden{display:none}
</style>
</head>
<body>
<div id="login">
<h1>🔐 Ibomnova Control</h1>
<div class="card">
<p>Enter Admin Password</p>
<input id="pwd" type="password" placeholder="Password">
<button onclick="check()">Enter</button>
<p id="err" style="color:red"></p>
</div>
</div>

<div id="panel" class="hidden">
<h1>IBOMNOVA CONTROL CENTRE 🚀</h1>
<p>Welcome Boss!</p>

<div class="card">
<h3>📊 Quick Stats</h3>
<p>Site: ibomnova.vercel.app</p>
<p>Status: <span style="color:#0f0">● Online</span></p>
</div>

<div class="card">
<h3>🛠️ Manage</h3>
<button onclick="location.href='/'">View Live Site</button><br><br>
<button onclick="location.href='/chat.html'">Open Chat</button><br><br>
<button onclick="location.href='/login.html'">View Login Page</button>
</div>

<div class="card">
<h3>⚙️ Actions</h3>
<button onclick="alert('User management go dey here - connect to Supabase later')">Manage Users</button><br><br>
<button onclick="location.reload()">Logout</button>
</div>

</div>

<script>
function check(){
 if(document.getElementById('pwd').value==='IbomBoss2026'){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
 } else {
  document.getElementById('err').innerText='Wrong password! Try: IbomBoss2026';
 }
}
</script>
</body>
</html>
