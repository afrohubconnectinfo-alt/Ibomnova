<!DOCTYPE html>
<html>
<head>
  <title>Login - Ibomnova</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;background:#0f0f0f;color:white}
    .box{background:#1e1e1e;padding:30px;border-radius:12px;width:300px}
    input{width:100%;padding:10px;margin:10px 0;border-radius:6px;border:none}
    button{width:100%;padding:12px;background:#7c3aed;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold}
    a{color:#7c3aed;text-decoration:none}
  </style>
</head>
<body>
<div class="box">
  <h2>Login to Ibomnova</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <button id="googleBtn" style="background:white;color:black;margin-top:10px">Sign in with Google</button>
  <p>No account? <a href="signup.html">Sign Up</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

document.getElementById("loginBtn").onclick = () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  signInWithEmailAndPassword(auth, email, password)
    .then(() => { alert("Login successful"); window.location.href = "index.html"; })
    .catch((e) => alert(e.message));
};

document.getElementById("googleBtn").onclick = () => {
  signInWithPopup(auth, provider)
    .then(() => { window.location.href = "index.html"; })
    .catch((e) => alert(e.message));
};
</script>
</body>
</html>
