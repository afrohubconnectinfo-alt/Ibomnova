<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibomnova AI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { background:#fff; color:#111; display:flex; flex-direction:column; height:100vh; }
header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid #eee; }
header .logo { font-weight:700; font-size:20px; }
header .logo span { background:#111; color:#fff; font-size:10px; padding:2px 6px; border-radius:10px; margin-left:6px; vertical-align:middle; }
header nav button { background:#111; color:#fff; border:none; padding:8px 16px; border-radius:20px; cursor:pointer; font-size:14px; }
#chat { flex:1; overflow-y:auto; padding:20px; max-width:800px; width:100%; margin:0 auto; }
.msg { margin:12px 0; padding:14px 18px; border-radius:18px; max-width:75%; line-height:1.5; font-size:15px; }
.user { background:#111; color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
.ai { background:#f3f3f3; color:#111; margin-right:auto; border-bottom-left-radius:4px; }
#inputArea { padding:16px; border-top:1px solid #eee; max-width:800px; width:100%; margin:0 auto; }
#inputBox { display:flex; gap:10px; }
#inputBox input { flex:1; padding:14px 18px; border:1px solid #ddd; border-radius:24px; outline:none; font-size:15px; }
#inputBox button { background:#111; color:#fff; border:none; padding:0 22px; border-radius:24px; cursor:pointer; font-weight:600; }
.hint { text-align:center; color:#888; font-size:13px; margin-top:10px; }
footer { text-align:center; padding:12px; color:#aaa; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="logo">ibomnova <span>AI</span></div>
  <nav>
    <span style="margin-right:16px; color:#666; font-size:14px; cursor:pointer;">Pricing</span>
    <button onclick="alert('Sign in coming soon!')">Sign in</button>
  </nav>
</header>

<div id="chat">
  <div class="msg ai">Hello! I'm Ibomnova. How can I help you today?</div>
</div>

<div id="inputArea">
  <div id="inputBox">
    <input id="messageInput" placeholder="Ask Ibomnova anything..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
  </div>
  <div class="hint">Example: Write a business plan for my fashion store</div>
</div>

<footer>© 2026 Ibomnova</footer>

<script>
async function sendMessage() {
  const input = document.getElementById('messageInput');
  const chat = document.getElementById('chat');
  const text = input.value.trim();
  if (!text) return;

  chat.innerHTML += `<div class="msg user">${text}</div>`;
  input.value = '';
  chat.scrollTop = chat.scrollHeight;

  const loadingId = 'loading-' + Date.now();
  chat.innerHTML += `<div class="msg ai" id="${loadingId}">Thinking...</div>`;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, type: 'general' })
    });
    const data = await res.json();
    document.getElementById(loadingId).remove();
    
    if (data.reply) {
      chat.innerHTML += `<div class="msg ai">${data.reply}</div>`;
    } else {
      chat.innerHTML += `<div class="msg ai">Sorry, I had trouble replying. Please try again.</div>`;
    }
  } catch (err) {
    document.getElementById(loadingId).remove();
    chat.innerHTML += `<div class="msg ai">Connection issue. Please check your internet and try again.</div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
