<!DOCTYPE html>
<html>
<head>
<title>Ibomnova - Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#0f0f0f;color:white;margin:0;display:flex;flex-direction:column;height:100vh}
.header{background:#171717;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:14px}
.row{max-width:90%;display:flex;flex-direction:column}
.row.user{align-self:flex-end} .row.ai{align-self:flex-start;width:92%}
.bubble{padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.user .bubble{background:#7c3aed;border-bottom-right-radius:4px}
.ai .bubble{background:#1e1e1e;border:1px solid #2a2a2a;border-bottom-left-radius:4px}
.actions{margin-top:6px;display:flex;gap:6px}
.copyBtn{font-size:11px;background:#2a2a2a;color:#aaa;border:1px solid #333;padding:4px 8px;border-radius:10px;cursor:pointer}
.input-area{background:#171717;padding:12px;display:flex;gap:8px;border-top:1px solid #222}
input{flex:1;padding:13px 16px;border-radius:24px;border:none;background:#2a2a2a;color:white;outline:none}
button#send{padding:12px 20px;background:#7c3aed;color:white;border:none;border-radius:24px;font-weight:bold;cursor:pointer}
.small{font-size:12px;background:#2a2a2a;padding:6px 12px;border-radius:12px;border:1px solid #333;color:white;cursor:pointer}
</style>
</head>
<body>
<div class="header"><b>IBOMNOVA</b><div><button class="small" id="clearBtn">New chat</button> <button class="small" id="logout">Logout</button></div></div>
<div class="chat" id="chat"></div>
<div class="input-area"><input id="input" placeholder="Ask about Uyo..."><button id="send">Send</button></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyCIjfg0XnJNlDnutG-8z0hzOH2Pun3Odog", authDomain: "ibomnova.firebaseapp.com", projectId: "ibomnova", storageBucket: "ibomnova.firebasestorage.app", messagingSenderId: "271815396164", appId: "1:271815396164:web:0d6b220c5881b984192511" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const chatEl = document.getElementById("chat");
let history = JSON.parse(localStorage.getItem("ibom_chat") || "[]");

function formatText(text){
  let t = text;
  // REMOVE table junk like | Era | and |---|
  t = t.split('\n').filter(l=>{
    const trimmed = l.trim();
    if(trimmed.includes('|---|')) return false;
    if(trimmed.startsWith('|') && trimmed.endsWith('|') && trimmed.split('|').length>3) return false;
    return true;
  }).join('\n');
  // REMOVE > and > * at start
  t = t.replace(/^>\s*\*?/gm, '').replace(/^\*\s+/gm, '• ');
  // REMOVE single *star* -> keep text only
  t = t.replace(/(^|[^*])\*([^*\n]+)\*([^*]|$)/g, '$1$2$3');
  // Bold **text**
  t = t.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  t = t.replace(/\n/g, '<br>');
  return t;
}

function render(){
  chatEl.innerHTML = history.length ? "" : '<div class="row ai"><div class="bubble">Hello! I\'m Ibomnova AI. How can I help you today?</div></div>';
  history.forEach(m=>{
    const row = document.createElement("div");
    row.className = `row ${m.role}`;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = m.role==='user' ? m.text.replace(/</g,'&lt;') : formatText(m.text);
    row.appendChild(bubble);
    if(m.role==='ai'){
      const act = document.createElement("div"); act.className="actions";
      const c = document.createElement("button"); c.className="copyBtn"; c.textContent="📋 Copy";
      c.onclick=()=>{navigator.clipboard.writeText(m.text); c.textContent="✅ Copied"; setTimeout(()=>c.textContent="📋 Copy",1500)};
      act.appendChild(c); row.appendChild(act);
    }
    chatEl.appendChild(row);
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}
render();
onAuthStateChanged(auth, u=>{ if(!u) location.href="login.html"; });
document.getElementById("logout").onclick=()=>signOut(auth).then(()=>location.href="login.html");
document.getElementById("clearBtn").onclick=()=>{history=[]; localStorage.removeItem("ibom_chat"); render();};
async function send(){
  const input=document.getElementById("input"); const text=input.value.trim(); if(!text) return;
  history.push({role:"user", text}); localStorage.setItem("ibom_chat", JSON.stringify(history)); render(); input.value="";
  const temp=document.createElement("div"); temp.className="row ai"; temp.innerHTML='<div class="bubble">Thinking...</div>'; chatEl.appendChild(temp);
  try{
    const res=await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({message:text, history: history.slice(-8)})});
    const data=await res.json(); temp.remove();
    history.push({role:"ai", text:data.reply||data.error}); localStorage.setItem("ibom_chat", JSON.stringify(history)); render();
  }catch(e){ temp.remove(); history.push({role:"ai", text:"Error: "+e.message}); render(); }
}
document.getElementById("send").onclick=send;
document.getElementById("input").addEventListener("keypress", e=>{ if(e.key==="Enter") send(); });
</script>
</body>
</html>
