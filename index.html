<!DOCTYPE html>
<html>
<head>
<title>Ibomnova - Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#0f0f0f;color:white;margin:0;display:flex;flex-direction:column;height:100vh}
.header{background:#1e1e1e;padding:15px;display:flex;justify-content:space-between;align-items:center}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 15px;border-radius:12px;max-width:80%}
.user{background:#7c3aed;align-self:flex-end}
.ai{background:#1e1e1e;align-self:flex-start}
.input-area{background:#1e1e1e;padding:15px;display:flex;gap:10px}
input{flex:1;padding:12px;border-radius:8px;border:none}
button{padding:12px 20px;background:#7c3aed;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
#logout{background:#333}
</style>
</head>
<body>
<div class="header">
<h3>Ibomnova AI</h3>
<button id="logout">Logout</button>
</div>
<div class="chat" id="chat">
<div class="msg ai">Hello! I'm Ibomnova AI. How can I help you today?</div>
</div>
<div class="input-area">
<input type="text" id="input" placeholder="Type message...">
<button id="send">Send</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyCIjfg0XnJNlDnutG-8z0hzOH2Pun3Odog",
  authDomain: "ibomnova.firebaseapp.com",
  projectId: "ibomnova",
  storageBucket: "ibomnova.firebasestorage.app",
  messagingSenderId: "271815396164",
  appId: "1:271815396164:web:0d6b220c5881b984192511"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user)=>{
  if(!user){ window.location.href = "login.html"; }
});

document.getElementById("logout").onclick = ()=>{ signOut(auth).then(()=>window.location.href="login.html"); };

async function send(){
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const text = input.value.trim();
  if(!text) return;
  chat.innerHTML += `<div class="msg user">${text}</div>`;
  input.value = "";
  chat.scrollTop = chat.scrollHeight;
  chat.innerHTML += `<div class="msg ai" id="temp">Thinking...</div>`;
  try{
    const res = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:text})
    });
    const data = await res.json();
    document.getElementById("temp").remove();
    chat.innerHTML += `<div class="msg ai">${data.reply || data.error || "No reply"}</div>`;
  }catch(e){
    document.getElementById("temp").remove();
    chat.innerHTML += `<div class="msg ai">Error: ${e.message}</div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
document.getElementById("send").onclick = send;
document.getElementById("input").addEventListener("keypress",(e)=>{ if(e.key==="Enter") send(); });
</script>
</body>
</html>
