<!DOCTYPE html>
<html>
<head>
<title>Ibomnova - Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#0f0f0f;color:white;margin:0;display:flex;flex-direction:column;height:100vh}
.header{background:#1e1e1e;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
.header h3{margin:0;font-size:16px}
.header span{font-size:12px;color:#aaa}
.chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{padding:12px 15px;border-radius:12px;max-width:85%;word-wrap:break-word;font-size:14px;line-height:1.4}
.user{background:#7c3aed;align-self:flex-end}
.ai{background:#1e1e1e;align-self:flex-start;border:1px solid #2a2a2a}
.input-area{background:#1e1e1e;padding:12px;display:flex;gap:8px;align-items:center}
input{flex:1;padding:12px;border-radius:20px;border:none;background:#2a2a2a;color:white;outline:none}
button{padding:10px 18px;background:#7c3aed;color:white;border:none;border-radius:20px;cursor:pointer;font-weight:bold}
.small{padding:6px 12px;font-size:12px;background:#333}
</style>
</head>
<body>
<div class="header">
<div><h3>Ibomnova AI</h3><span id="userEmail">loading...</span></div>
<div><button class="small" id="clearBtn">Clear</button> <button class="small" id="logout">Logout</button></div>
</div>
<div class="chat" id="chat"></div>
<div class="input-area">
<input type="text" id="input" placeholder="Ask anything...">
<button id="send">Send</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyCIjfg0XnJNlDnutG-8z0hzOH2Pun3Odog",
  authDomain: "ibomnova.firebaseapp.com",
  projectId: "ibomnova",
  storageBucket: "ibomnova.firebasestorage.app",
  messagingSenderId: "271815396164",
  appId: "1:271815396164:web:0d6b220c5881b984192511"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const chatEl = document.getElementById("chat");
let history = JSON.parse(localStorage.getItem("ibom_chat") || "[]");
let currentUser = null;

function render(){
  chatEl.innerHTML = history.length ? "" : '<div class="msg ai">Hello! I\'m Ibomnova AI. How can I help you today?</div>';
  history.forEach(m=>{
    chatEl.innerHTML += `<div class="msg ${m.role==='user'?'user':'ai'}">${m.text}</div>`;
  });
  chatEl.scrollTop = chatEl.scrollHeight;
}
render();

onAuthStateChanged(auth, (user)=>{
  if(!user){ window.location.href = "login.html"; return; }
  currentUser = user;
  document.getElementById("userEmail").textContent = user.email;
});

document.getElementById("logout").onclick = ()=>{ signOut(auth).then(()=>{ localStorage.removeItem("ibom_chat"); window.location.href="login.html"; }); };
document.getElementById("clearBtn").onclick = ()=>{ history=[]; localStorage.removeItem("ibom_chat"); render(); };

async function send(){
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;
  history.push({role:"user", text});
  localStorage.setItem("ibom_chat", JSON.stringify(history));
  render();
  input.value = "";
  const thinking = document.createElement("div");
  thinking.className = "msg ai"; thinking.textContent = "Thinking..."; thinking.id="thinking";
  chatEl.appendChild(thinking);
  chatEl.scrollTop = chatEl.scrollHeight;
  try{
    const res = await fetch("/api/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({message:text, history: history.slice(-10)})
    });
    const data = await res.json();
    document.getElementById("thinking")?.remove();
    const reply = data.reply || data.error || "No response";
    history.push({role:"ai", text:reply});
    localStorage.setItem("ibom_chat", JSON.stringify(history));
    render();
  }catch(e){
    document.getElementById("thinking")?.remove();
    history.push({role:"ai", text:"Error: "+e.message});
    render();
  }
}
document.getElementById("send").onclick = send;
document.getElementById("input").addEventListener("keypress",(e)=>{ if(e.key==="Enter") send(); });
</script>
</body>
</html>
