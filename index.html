<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibomnova AI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
body { background:#fff; color:#111; display:flex; flex-direction:column; height:100vh; }
header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid #eee; position:sticky; top:0; background:#fff; z-index:10; }
.logo { font-weight:800; font-size:20px; letter-spacing:-0.5px; }
.logo span { background:#111; color:#fff; font-size:10px; padding:3px 7px; border-radius:10px; margin-left:6px; }
#chat { flex:1; overflow-y:auto; padding:20px; max-width:800px; width:100%; margin:0 auto; scroll-behavior:smooth; }
.msg { margin:14px 0; padding:14px 18px; border-radius:18px; max-width:78%; line-height:1.6; font-size:15px; white-space:pre-wrap; word-wrap:break-word; }
.user { background:#111; color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
.ai { background:#f5f5f5; color:#111; margin-right:auto; border-bottom-left-radius:4px; }
#inputArea { padding:14px 14px 8px; border-top:1px solid #eee; max-width:800px; width:100%; margin:0 auto; background:#fff; }
#inputBox { display:flex; gap:10px; align-items:center; }
#inputBox input { flex:1; padding:15px 20px; border:1.5px solid #ddd; border-radius:28px; outline:none; font-size:16px; color:#111 !important; background:#fff !important; }
#inputBox input:focus { border-color:#111; }
#inputBox button { background:#111; color:#fff; border:none; padding:14px 24px; border-radius:28px; cursor:pointer; font-weight:700; font-size:15px; }
.hint { text-align:center; color:#999; font-size:12px; margin-top:8px; }
footer { text-align:center; padding:10px; color:#bbb; font-size:11px; }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "REPLACE_WITH_YOUR_REAL_KEY",
  authDomain: "REPLACE_WITH_YOUR_DOMAIN.firebaseapp.com",
  projectId: "REPLACE_WITH_YOUR_PROJECT_ID",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// PROTECT PAGE - REDIRECT IF NOT LOGGED IN
onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  } else {
    const emailSpan = document.getElementById("userEmail");
    if(emailSpan) emailSpan.textContent = user.email;
  }
});

window.logoutUser = () => {
  signOut(auth).then(()=> window.location.href="login.html");
}
</script>
</head>
<body>
<header>
  <div class="logo">ibomnova <span>AI</span></div>
  <div style="display:flex; align-items:center; gap:12px;">
    <span id="userEmail" style="font-size:12px; color:#666; max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
    <div style="font-size:14px; color:#666; cursor:pointer;" onclick="logoutUser()">Logout</div>
  </div>
</header>

<div id="chat">
  <div class="msg ai">Hello! I'm Ibomnova. How can I help you today?</div>
</div>

<div id="inputArea">
  <div id="inputBox">
    <input id="messageInput" type="text" placeholder="Ask Ibomnova anything..." autocomplete="off">
    <button onclick="sendMessage()">Send</button>
  </div>
  <div class="hint">Example: Write a business plan for my fashion store</div>
</div>

<footer>© 2026 Ibomnova</footer>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('messageInput');

input.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  
  chat.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
  input.value = '';
  scrollDown();

  const loadingId = 'ld-' + Date.now();
  chat.innerHTML += `<div class="msg ai" id="${loadingId}">● ● ●</div>`;
  scrollDown();

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    document.getElementById(loadingId)?.remove();
    chat.innerHTML += `<div class="msg ai">${escapeHtml(data.reply || 'Sorry, please try again.')}</div>`;
  } catch {
    document.getElementById(loadingId)?.remove();
    chat.innerHTML += `<div class="msg ai">Network error. Please check connection and try again.</div>`;
  }
  scrollDown();
}
function scrollDown() { setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50); }
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
